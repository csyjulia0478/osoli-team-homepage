name: "🐛 Bug"
description: "버그 및 오류를 제보합니다."
title: "[Fix] "
labels: []
assignees: []

body:
  - type: textarea
    id: bug-description
    attributes:
      label: "🐛 버그 설명"
      placeholder: "발생한 문제를 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "🔄 재현 방법"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 예상 동작"
      placeholder: "정상적으로 동작했을 때의 결과를 작성해주세요."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ 실제 동작"
      placeholder: "실제로 발생한 결과를 작성해주세요."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "💻 실행 환경"
      placeholder: "예: macOS, Chrome"
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: "📸 스크린샷 및 로그"
      description: "필요하다면 오류 화면이나 콘솔 로그를 첨부해주세요."
    validations:
      required: false
