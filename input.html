<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osoviz - Input</title>
    <link rel="stylesheet" href="css/common.css">
</head>

<body>

    <header>
        <p>Osoviz</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="input.html" aria-current="page">Input</a>
            <a href="generate.html">Generate</a>
        </nav>
    </header>


    <main>

        <h1>Data Input</h1>

        <section class="card data-table-card">
            <h2 id="data-table-heading">Data Table</h2>

            <p id="data-input-help">Edit cells directly. Scroll within the table to see additional columns.</p>
            <div class="data-table-actions">
                <button id="add-row" type="button" class="button-secondary">Add row</button>
                <button id="delete-row" type="button" class="button-secondary">Delete rows</button>
                <button id="add-column" type="button" class="button-secondary">Add column</button>
                <button id="delete-column" type="button" class="button-secondary">Delete column</button>
            </div>
            <div id="data-table" aria-labelledby="data-table-heading" aria-describedby="data-input-help"></div>
        </section>

        <!--차트 업로드-->
        <section class="card">
            <h2>File Upload</h2>

            <label>
                Choose a CSV or Excel file:
                <input id="data-file" name="data-file" type="file" accept=".csv,.xlsx,.xls">
            </label>
            <p id="file-upload-status" role="status"></p>
            <p id="data-input-error" role="alert"></p>

        </section>


        <!--차트타입 선택-->
        <section class="card">
            <h2>Chart Type</h2>

            <fieldset id="chart-type-options">
                <legend>Select a chart type</legend>

                <label>
                    <input type="radio" name="chart-type" value="bar">
                    Bar
                </label>

                <label>
                    <input type="radio" name="chart-type" value="line">
                    Line
                </label>

                <label>
                    <input type="radio" name="chart-type" value="pie">
                    Pie
                </label>

                <label>
                    <input type="radio" name="chart-type" value="scatter">
                    Scatter
                </label>

                <label>
                    <input type="radio" name="chart-type" value="bubble">
                    Bubble
                </label>

            </fieldset>
        </section>


        <!--색약유형 선택-->
        <section class="card">
            <h2>Color Vision Type</h2>

            <fieldset id="color-vision-options">
                <legend>Select a color vision type</legend>

                <label>
                    <input type="radio" name="color-vision-type" value="general">
                    General
                </label>

                <label>
                    <input type="radio" name="color-vision-type" value="protanopia">
                    Protanopia
                </label>

                <label>
                    <input type="radio" name="color-vision-type" value="deuteranopia">
                    Deuteranopia
                </label>

                <label>
                    <input type="radio" name="color-vision-type" value="tritanopia">
                    Tritanopia
                </label>

            </fieldset>
        </section>

        <a id="next-step" class="button" href="generate.html">Next</a>

    </main>


    <footer>
        <p>Osoviz</p>
    </footer>

    <script type="module" src="js/colorSelect.js"></script>

</body>

</html>
